name: Patch N Linux golden trials

# Manual run (Actions -> Patch N Linux golden trials -> Run workflow).
# Diagnostics follow the other workflows: step logs and exit markers under ci-logs/, JUnit timings, an AI-DEBUG-SUMMARY.md
# with the run id, number and URL, and one artifact named `<workflow>-<run id>` (detailed-logs.zip, AI-DEBUG-SUMMARY.md, RUN-INFO.json).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

jobs:
  linux-golden:
    name: Linux reference-trial golden results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Run facts
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/01-run-facts.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/01-run-facts.exit' EXIT
          {
          echo "workflow ${{ github.workflow }}, run ${{ github.run_id }} (#${{ github.run_number }}), attempt ${{ github.run_attempt }}"
          echo "commit $GITHUB_SHA, ref $GITHUB_REF"
          echo "node $(node -v), npm $(npm -v), runner $RUNNER_OS $RUNNER_ARCH"
          } > ci-logs/01-run-facts.log 2>&1
      - name: Install locked dependencies
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/02-npm-ci-ignore-scripts.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/02-npm-ci-ignore-scripts.exit' EXIT
          {
          npm ci --ignore-scripts
          } > ci-logs/02-npm-ci-ignore-scripts.log 2>&1
      - name: Build and compile tests
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/03-build-and-compile-tests.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/03-build-and-compile-tests.exit' EXIT
          {
          npm run build
          npx tsc -p tsconfig.tests.json
          } > ci-logs/03-build-and-compile-tests.log 2>&1
      - name: Verify Linux reference-trial golden results
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/04-verify-linux-golden-results.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/04-verify-linux-golden-results.exit' EXIT
          {
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=ci-logs/junit-linux-golden.xml \
            dist-tests/legacy-reference-trials.test.js
          } > ci-logs/04-verify-linux-golden-results.log 2>&1
      - name: Test AI debugging summary generator
        if: always()
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/05-test-ci-ai-summary-generator.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/05-test-ci-ai-summary-generator.exit' EXIT
          {
          npm run ci:summary:test
          } > ci-logs/05-test-ci-ai-summary-generator.log 2>&1
      - name: Generate AI debugging summary
        if: always()
        env:
          GITHUB_ACTIONS: "true"
        run: |
          npm run ci:summary
          if [ -f AI-DEBUG-SUMMARY.md ]; then
            echo "::notice title=AI-DEBUG-SUMMARY written::Run ${{ github.run_id }} (#${{ github.run_number }}): see the workflow artifact."
          fi
      - name: Upload job logs (merged later, ci-quiet)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-parts-logs-linux-golden
          path: ci-logs/
          retention-days: 14
          if-no-files-found: ignore

  logs:
    name: one artifact (detailed logs zip + failure brief)
    needs: [linux-golden]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download job log parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-parts-*
          path: collected
          merge-multiple: true
      - name: Flatten logs and package single artifact
        if: always()
        run: |
          mkdir -p ci-logs
          find collected -type f \( -name '*.log' -o -name '*.exit' -o -name '*.summary.md' -o -name '*.txt' -o -name '*.json' -o -name '*.xml' \) -print0 |
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              parent=$(basename "$(dirname "$f")")
              if [ "$parent" = "ci-logs" ] || [ "$parent" = "collected" ]; then
                cp "$f" "ci-logs/$base" 2>/dev/null || true
              else
                cp "$f" "ci-logs/$parent-$base" 2>/dev/null || true
              fi
            done
          npm ci --ignore-scripts
          node tests/ci-package-artifacts.mjs ci-logs artifact
      - name: Upload single workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.workflow }}-${{ github.run_id }}
          path: artifact/
          retention-days: 14
          if-no-files-found: warn

      - name: Delete intermediate ci-parts artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          API="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100"
          ids=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" \
            | node -e '
              let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
                const j=JSON.parse(d);
                for (const a of j.artifacts||[]) {
                  if (/^ci-parts-/.test(a.name)) console.log(a.id+"\t"+a.name);
                }
              });
            ')
          if [ -z "$ids" ]; then
            echo "No intermediate artifacts to delete."
            exit 0
          fi
          echo "$ids" | while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            echo "Deleting artifact $name ($id)"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}" \
              && echo "  deleted" || echo "  delete failed (non-fatal)"
          done
