name: Patch N Linux golden trials

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  linux-golden:
    name: Linux reference-trial golden results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build and compile tests
        run: |
          npm run build
          npx tsc -p tsconfig.tests.json
      - name: Verify Linux reference-trial golden results
        run: node --test dist-tests/legacy-reference-trials.test.js
