name: Mutation testing

# Manual only (Actions -> Mutation testing -> Run workflow). Stryker mutates the compiled pure modules and runs the
# node:test files that cover them; the run takes several minutes, so it is not part of the default gates.
# The mutation score has a floor (`thresholds.break` in stryker.config.json); the JSON report is kept as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run Stryker on the pure modules
        run: npm run mutation
      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          if-no-files-found: warn
