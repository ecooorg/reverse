name: Supply chain

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm audit signatures
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > reverse.cdx.json
      - name: Check SBOM is non-empty and names the package
        run: node -e "const s=require('./reverse.cdx.json'); if(s.bomFormat!=='CycloneDX'||!s.components?.some(c=>c.name==='reverse-compact')) process.exit(1)"
