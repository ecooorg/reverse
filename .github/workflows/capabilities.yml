name: Capabilities

# Verifies what Reverse can REALLY do (not what the docs say), on Linux, macOS and Windows.
#   capabilities  - unit tests (Linux) + tests/capabilities.check.ts against the built library, CLI and MCP server
#   package       - npm pack -> install the tarball in a clean project -> run the installed `reverse`
#   summary       - merges all reports into one capability-by-platform matrix (job summary + annotations)
# Repository layout and Markdown links are checked by structure.yml (cheap, always on).
#
# Outcomes per check: verified / limitation (a documented limit is real) / drift (docs vs behaviour,
# defects) / failed. Only "failed" turns the workflow red; drift appears as warnings.
#
# Minute budget (see docs/GITHUB.md): macOS bills 10x and Windows 2x, so nothing expensive runs by itself.
#   push / pull request : ONE job, Linux, Node 22 (unit tests + capability suite + report). No package job.
#   workflow_dispatch   : the extended run you start by hand (Actions -> Capabilities -> Run workflow):
#                         choose the operating system(s); Node 22 and 24 each; plus the package job
#                         and the merged capability matrix.
# There is deliberately no schedule.

on:
  push:
    branches: [main, develop]
    # Documentation that no check reads. docs/MCP.md and docs/CAPABILITIES.md are NOT listed on
    # purpose: capabilities.check.ts compares them with the real tool list and provider list.
    paths-ignore:
      - README.md
      - AGENTS.md
      - .gitignore
      - docs/ARCHITECTURE.md
      - docs/BENCHMARKS.md
      - docs/GITHUB.md
      - docs/ROADMAP.md
      - docs/SECURITY.md
  pull_request:
    paths-ignore:
      - README.md
      - AGENTS.md
      - .gitignore
      - docs/ARCHITECTURE.md
      - docs/BENCHMARKS.md
      - docs/GITHUB.md
      - docs/ROADMAP.md
      - docs/SECURITY.md
  workflow_dispatch:
    inputs:
      os:
        description: Operating systems to verify (macOS bills 10x, Windows 2x)
        type: choice
        options: [all, ubuntu-latest, windows-latest, macos-latest]
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capabilities:
    name: capabilities (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.os == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.os)) || '["ubuntu-latest"]') }}
        node: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[22,24]' || '[22]') }}
    env:
      REVERSE_CAPABILITY_REPORT: capability-reports/${{ matrix.os }}-node${{ matrix.node }}.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Toolchain and runner facts
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/01-toolchain-and-runner-facts.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/01-toolchain-and-runner-facts.exit' EXIT
          {
          echo "node $(node -v), npm $(npm -v), shell $BASH_VERSION"
          node -p "'platform ' + process.platform + ' ' + process.arch + ', cores ' + require('os').availableParallelism() + ', RAM GiB ' + (require('os').totalmem()/2**30).toFixed(1)"
          echo "commit $GITHUB_SHA, event $GITHUB_EVENT_NAME"
          } > ci-logs/01-toolchain-and-runner-facts.log 2>&1
      # --ignore-scripts: the `prepare` hook would build once here and the next step builds again.
      - run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/02-npm-ci-ignore-scripts.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/02-npm-ci-ignore-scripts.exit' EXIT
          {
          npm ci --ignore-scripts
          } > ci-logs/02-npm-ci-ignore-scripts.log 2>&1
      - name: Static quality gates (format and own-line budget)
        run: |
          npm run format:check
          npm run size:check
      - name: Build library, CLI and MCP server
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/03-build-library-cli-and-mcp-server.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/03-build-library-cli-and-mcp-server.exit' EXIT
          {
          npm run build
          } > ci-logs/03-build-library-cli-and-mcp-server.log 2>&1
      - name: Package targets (built tree)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/04-package-targets-built-tree.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/04-package-targets-built-tree.exit' EXIT
          {
          node tests/check-structure.mjs --built
          } > ci-logs/04-package-targets-built-tree.log 2>&1
      - name: Build the verification suite
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/05-build-the-verification-suite.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/05-build-the-verification-suite.exit' EXIT
          {
          npx tsc -p tsconfig.tests.json
          } > ci-logs/05-build-the-verification-suite.log 2>&1
      - name: Unit tests
        if: runner.os == 'Linux'
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/06-unit-tests.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/06-unit-tests.exit' EXIT
          {
          node --test dist-tests/*.test.js
          } > ci-logs/06-unit-tests.log 2>&1
      - name: Exercise every capability (library API, CLI, MCP stdio)
        # Two reporters: readable spec output in the log and JUnit XML (per-check durations) for the diagnostics below.
        # --test-timeout names a hung check instead of letting the whole job die silently at the job timeout.
        timeout-minutes: 8
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/07-exercise-every-capability-library-api-cl.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/07-exercise-every-capability-library-api-cl.exit' EXIT
          {
          mkdir -p capability-reports
          node --test --test-timeout=240000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=capability-reports/junit-${{ matrix.os }}-node${{ matrix.node }}.xml \
            dist-tests/capabilities.check.js
          } > ci-logs/07-exercise-every-capability-library-api-cl.log 2>&1
      - name: Diagnostics (job summary, slowest checks, failures, host load)
        if: always()
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/08-diagnostics-job-summary-slowest-checks-f.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/08-diagnostics-job-summary-slowest-checks-f.exit' EXIT
          {
          node - <<'DIAG'
          const fs = require('fs'), os = require('os');
          const out = [];
          const label = '${{ matrix.os }} / node ${{ matrix.node }}';
          out.push(`### Capability run: ${label}`, '');
          out.push(`Runner: ${os.platform()} ${os.release()} ${process.arch}, ${os.availableParallelism()} cores, ${(os.totalmem()/2**30).toFixed(1)} GiB RAM, free ${(os.freemem()/2**30).toFixed(1)} GiB, load ${os.loadavg().map(x => x.toFixed(2)).join('/')}`, '');
          const xmlFile = fs.readdirSync('capability-reports').find(f => f.startsWith('junit-'));
          if (!xmlFile) { out.push('No JUnit file was written: the suite did not start or crashed before reporting.'); }
          else {
            const xml = fs.readFileSync('capability-reports/' + xmlFile, 'utf8');
            const unesc1 = t => t.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
            const unesc = t => unesc1(unesc1(t)); // Node's JUnit reporter escapes some characters twice
            const cases = xml.split('<testcase ').slice(1).map(seg => {
              const name = unesc((seg.match(/name="([^"]*)"/) || [])[1] || '?');
              const ms = Math.round(parseFloat((seg.match(/time="([^"]*)"/) || [])[1] || '0') * 1000);
              const head = seg.split('</testcase>')[0];
              const failed = head.includes('<failure');
              const skipped = head.includes('<skipped');
              const msg = unesc(((head.match(/<failure[^>]*message="([^"]*)"/) || [])[1] || '').slice(0, 400));
              return { name, ms, failed, skipped, msg };
            });
            const total = cases.reduce((a, c) => a + c.ms, 0);
            out.push(`Checks: ${cases.length}, failed: ${cases.filter(c => c.failed).length}, skipped: ${cases.filter(c => c.skipped).length}, summed duration: ${(total/1000).toFixed(1)} s`, '');
            const failed = cases.filter(c => c.failed);
            if (failed.length) {
              out.push('#### Failed checks', '');
              for (const c of failed) { out.push(`- **${c.name}** (${c.ms} ms): ${c.msg}`); console.log(`::error title=Capability check failed (${label})::${c.name}: ${c.msg}`); }
              out.push('');
            }
            out.push('#### Ten slowest checks', '', '| ms | check |', '|---:|---|');
            for (const c of [...cases].sort((a, b) => b.ms - a.ms).slice(0, 10)) out.push(`| ${c.ms} | ${c.name.replace(/\|/g, '\\|')} |`);
            out.push('');
            for (const c of cases) if (c.ms > 60000) console.log(`::warning title=Slow check (${label})::${c.name} took ${(c.ms/1000).toFixed(0)} s`);
          }
          const rep = fs.readdirSync('capability-reports').find(f => f.endsWith('.json'));
          if (rep) {
            const r = JSON.parse(fs.readFileSync('capability-reports/' + rep, 'utf8'));
            out.push(`Totals: ${JSON.stringify(r.totals)} (Reverse ${r.reverse}, Node ${r.node}, OS release ${r.osRelease})`, '');
            const lim = r.records.filter(x => x.status === 'limitation' || x.status === 'drift');
            if (lim.length) { out.push('#### Limitations and drift on this platform', ''); for (const x of lim) out.push(`- ${x.status === 'drift' ? '⚠️' : '🚧'} ${x.area}: ${x.name}${x.detail ? ' — ' + x.detail : ''}`); out.push(''); }
          } else out.push('No capability JSON report was written.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          DIAG
          } > ci-logs/08-diagnostics-job-summary-slowest-checks-f.log 2>&1
      - name: Capability report (single run)
        if: always() && github.event_name != 'workflow_dispatch'
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/09-capability-report-single-run.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/09-capability-report-single-run.exit' EXIT
          {
          if compgen -G 'capability-reports/*.json' > /dev/null; then node tests/capability-report.mjs capability-reports/*.json; fi
          } > ci-logs/09-capability-report-single-run.log 2>&1
      - name: Upload capability report and JUnit timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-parts-report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            capability-reports/*.json
            capability-reports/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload job logs (merged later, ci-quiet)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-parts-logs-capabilities-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ci-logs/
          retention-days: 14
          if-no-files-found: ignore
  package:
    name: package (${{ matrix.os }})
    # Manual runs only. The tarball is plain JavaScript, so with "all" Linux plus Windows (for the
    # installed `reverse` command shim) is enough; macOS runs it only when chosen explicitly.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'all' && '["ubuntu-latest","windows-latest"]' || format('["{0}"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # `npm pack` runs the `prepare` hook, which builds dist/ exactly once.
      - run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/01-npm-ci-ignore-scripts.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/01-npm-ci-ignore-scripts.exit' EXIT
          {
          npm ci --ignore-scripts
          } > ci-logs/01-npm-ci-ignore-scripts.log 2>&1
      - name: Pack the tarball and inspect its contents
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/02-pack-the-tarball-and-inspect-its-content.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/02-pack-the-tarball-and-inspect-its-content.exit' EXIT
          {
          mkdir -p .tmp-pack
          npm pack --pack-destination .tmp-pack --silent
          npm pack --dry-run --json --ignore-scripts > .tmp-pack/manifest.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync(".tmp-pack/manifest.json","utf8"))[0].files.map(f => f.path);
            const need = ["dist/index.js","dist/index.d.ts","dist/cli-main.js","dist/mcp-server.js","package.json","README.md"];
            const missing = need.filter(f => !files.includes(f));
            const leaked = files.filter(f => /^(src|tests|docs|\.github|node_modules)\//.test(f));
            console.log(files.length + " files in tarball");
            if (missing.length) { console.log("::error::tarball is missing: " + missing); process.exit(1); }
            if (leaked.length) console.log("::warning::tarball contains non-runtime files: " + leaked.slice(0,5));
          '
          } > ci-logs/02-pack-the-tarball-and-inspect-its-content.log 2>&1
      - name: Install the tarball into a clean project
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/03-install-the-tarball-into-a-clean-project.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/03-install-the-tarball-into-a-clean-project.exit' EXIT
          {
          mkdir .tmp-consumer && cd .tmp-consumer
          echo '{"name":"consumer","version":"1.0.0","private":true}' > package.json
          npm install ../.tmp-pack/*.tgz --silent
          } > ci-logs/03-install-the-tarball-into-a-clean-project.log 2>&1
      - name: Installed CLI works
        working-directory: .tmp-consumer
        run: |
          mkdir -p ../ci-logs
          export GITHUB_STEP_SUMMARY=../ci-logs/04-installed-cli-works.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ../ci-logs/04-installed-cli-works.exit' EXIT
          {
          npx --no-install reverse --help | grep -q "Usage: reverse"
          npx --no-install reverse analyzers | grep -q ghidra
          npx --no-install reverse binary "$(node -p 'process.execPath')" | grep -q '"format"'
          } > ../ci-logs/04-installed-cli-works.log 2>&1
      - name: Installed library imports by package name
        working-directory: .tmp-consumer
        run: |
          mkdir -p ../ci-logs
          export GITHUB_STEP_SUMMARY=../ci-logs/05-installed-library-imports-by-package-nam.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ../ci-logs/05-installed-library-imports-by-package-nam.exit' EXIT
          {
          node --input-type=module -e '
            import * as reverse from "reverse-compact";
            for (const k of ["analyzeBinary","runBenchmark","validateBehavior","EvidenceEngine","listProviders"])
              if (typeof reverse[k] !== "function") { console.error("missing export " + k); process.exit(1); }
            console.log("exports ok: " + Object.keys(reverse).length);
          '
          } > ../ci-logs/05-installed-library-imports-by-package-nam.log 2>&1
      - name: Installed MCP server answers tools/list
        working-directory: .tmp-consumer
        run: |
          mkdir -p ../ci-logs
          export GITHUB_STEP_SUMMARY=../ci-logs/06-installed-mcp-server-answers-tools-list.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ../ci-logs/06-installed-mcp-server-answers-tools-list.exit' EXIT
          {
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node node_modules/reverse-compact/dist/mcp-server.js | grep -q '"inspect_target"'
          } > ../ci-logs/06-installed-mcp-server-answers-tools-list.log 2>&1

      - name: Upload job logs (merged later, ci-quiet)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-parts-logs-package-${{ matrix.os }}
          path: |
            ci-logs/
          retention-days: 14
          if-no-files-found: ignore
  summary:
    name: capability matrix
    needs: capabilities
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: ci-parts-report-*
          path: reports
          merge-multiple: true
      - name: Merge reports, annotate drift, fail on broken capabilities
        run: |
          mkdir -p ci-logs
          export GITHUB_STEP_SUMMARY=ci-logs/01-merge-reports-annotate-drift-fail-on-bro.summary.md
          trap 'rc=$?; [ "$rc" = 0 ] || echo "$rc" > ci-logs/01-merge-reports-annotate-drift-fail-on-bro.exit' EXIT
          {
          node tests/capability-report.mjs reports/*.json
          } > ci-logs/01-merge-reports-annotate-drift-fail-on-bro.log 2>&1

      - name: Upload job logs (merged later, ci-quiet)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-parts-logs-summary
          path: |
            ci-logs/
          retention-days: 14
          if-no-files-found: ignore

  logs:
    name: all logs (one artifact)
    needs: [capabilities, package, summary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: ${{ github.workflow }}
          pattern: ci-parts-*
          separate-directories: true
          delete-merged: true
          retention-days: 14
